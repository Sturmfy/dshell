<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>正在启动 DSH…</title>
    <link rel="stylesheet" href="__STYLES__" />
  </head>
  <body class="shell-body">
    <!--
      Shown inside a content webview while its backend starts. This is a dshell
      asset, so it may use IPC; a DSH page never can.
    -->
    <main class="shell" id="shell" data-mode="placeholder">
      <div class="shell__spinner" aria-hidden="true"></div>
      <h1 class="shell__title" id="shell-title">正在启动 DSH…</h1>
      <!--
        The generic line, so the very first paint is never wrong. The script
        replaces it with the one that matches this tab's runtime as soon as the
        tab's view is available; a source checkout must not be told it is
        downloading an npx package.
      -->
      <p class="shell__subtitle" id="shell-subtitle">
        dshell 已在后台启动后端，就绪后会自动切换到这个选项卡。
      </p>
      <div class="shell__meta" id="shell-meta"></div>
      <pre class="shell__log" id="shell-log" hidden></pre>
      <div class="shell__actions" id="shell-actions"></div>
      <p class="shell__hint" id="shell-hint"></p>
    </main>
    <script type="module" src="__SHELL_JS__"></script>
  </body>
</html>
