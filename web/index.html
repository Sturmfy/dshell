<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dshell</title>
    <link rel="stylesheet" href="__STYLES__" />
  </head>
  <body class="strip-body">
    <!--
      The tab strip — dshell's title bar.

      It is on screen in every state, including while a panel is open: the window
      is frameless, so the drag region here is the only way to move it, and these
      are the only window buttons. Panels therefore live in a separate webview
      *below* this one instead of covering it.

      `data-tauri-drag-region` values (see tauri's `window/scripts/drag.js`):

        "deep"  — a click anywhere in this subtree drags, *except* on an
                  interactive element or a descendant marked "false"
        bare    — drags only when the click target is this exact element, which
                  is far too easy to break with one stray child element
        "false" — blocks dragging for this element and its ancestors

      The whole strip is "deep" and every interactive zone inside it is "false",
      so the drag region cannot be defeated by a layout change — an empty area
      stays draggable no matter what gets rendered next to it.
    -->
    <div id="chrome" class="chrome" data-tauri-drag-region="deep">
      <div class="tabstrip" id="tabstrip" data-tauri-drag-region="false"></div>
      <div class="chrome__spacer"></div>
      <div class="window-controls" id="window-controls" data-tauri-drag-region="false"></div>
    </div>
    <script type="module" src="__APP_JS__"></script>
  </body>
</html>
