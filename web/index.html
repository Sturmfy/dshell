<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>dshell</title>
    <link rel="stylesheet" href="__STYLES__" />
  </head>
  <body class="strip-body">
    <!--
      The tab strip — dshell's title bar.

      It is on screen in every state, including while a panel is open: the window
      is frameless, so `data-tauri-drag-region` here is the only way to move it,
      and these are the only window buttons. Panels therefore live in a separate
      webview *below* this one instead of covering it.
    -->
    <div id="chrome" class="chrome">
      <div class="chrome__drag" data-tauri-drag-region></div>
      <div class="tabstrip" id="tabstrip" data-tauri-drag-region></div>
      <div class="chrome__spacer" data-tauri-drag-region></div>
      <div class="window-controls" id="window-controls"></div>
    </div>
    <script type="module" src="__APP_JS__"></script>
  </body>
</html>
