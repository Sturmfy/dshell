name: ci

# The portability feedback loop: every push/PR must compile, test and lint on the
# platforms a release targets. macOS runs on the arm64 image; Linux is not
# shipped yet (see docs/platforms.md), so it has no CI row.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version files agree
        run: node tools/check-version.mjs

      - name: Version tooling tests
        run: npm run test:version

      - name: Build the UI bundle
        run: npm run build:ui

      - name: Rust tests
        run: npm test

      - name: Clippy
        run: npm run check

      - name: Bridge tests
        run: npm run test:bridge
