name: ci

# The portability feedback loop: every push/PR must compile, test and lint on the
# three platforms a release targets. Windows is the reference platform; Linux and
# macOS are the ones a Windows-only laptop cannot check.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '20'

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-22.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      # Tauri on Linux links WebKitGTK/GTK at build time, so the dev packages
      # are a build dependency, not a runtime nicety.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev \
            librsvg2-dev patchelf libfuse2

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      - name: Version files agree
        run: node tools/check-version.mjs

      - name: Version tooling tests
        run: npm run test:version

      - name: Build the UI bundle
        run: npm run build:ui

      - name: Rust tests
        run: npm test

      - name: Clippy
        run: npm run check

      - name: Bridge tests
        run: npm run test:bridge
