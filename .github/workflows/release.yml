name: release

# Tag-driven release. A `v*` tag builds the two deliverables and creates a
# draft GitHub Release; a manual run with `publish: false` builds the same
# artifacts without touching Releases, which is how a port gets tested before
# the first cross-platform tag exists.
#
# Linux is not shipped yet (docs/platforms.md): its code paths exist but have no
# CI row and no release job.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to build (e.g. v0.2.0)'
        required: true
        type: string
      publish:
        description: 'Create the draft GitHub Release from the artifacts'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NODE_VERSION: '20'

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.check.outputs.version }}
      prerelease: ${{ steps.check.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Resolve the tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ github.ref_name }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Version files and tag must agree
        id: check
        run: |
          node tools/check-version.mjs "${{ steps.tag.outputs.tag }}"
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "${{ steps.tag.outputs.tag }}" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *)   echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            arch: x64
          - os: macos-latest
            platform: macos
            arch: universal
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      # A universal macOS bundle needs both slices; the runner is arm64.
      - name: macOS universal targets
        if: runner.os == 'macOS'
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci

      # Signing and notarization are opt-in: without the secrets the DMG is
      # Ad-hoc/unsigned and the release notes say so. `tauri` only signs when
      # these variables are non-empty, so absent secrets must not be exported
      # as empty strings.
      - name: Configure macOS signing (if secrets exist)
        if: runner.os == 'macOS'
        env:
          CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$CERTIFICATE" ]; then
            {
              echo "APPLE_CERTIFICATE=$CERTIFICATE"
              echo "APPLE_CERTIFICATE_PASSWORD=$CERTIFICATE_PASSWORD"
              echo "APPLE_SIGNING_IDENTITY=$SIGNING_IDENTITY"
              echo "APPLE_ID=$APPLE_ID"
              echo "APPLE_PASSWORD=$APPLE_PASSWORD"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID"
            } >> "$GITHUB_ENV"
          else
            echo "::notice::No Apple secrets: building an unsigned DMG."
          fi

      # ---- Windows: the existing single-file path, unchanged -----------------
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run build
          npm run binary

      - name: Stage artifact (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = '${{ needs.verify.outputs.version }}'
          New-Item -ItemType Directory -Force staging | Out-Null
          Copy-Item release/dshell.exe "staging/dshell-$version-windows-x64.exe"

      # ---- macOS: one universal .app inside a .dmg ---------------------------
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          npm run build:ui
          npx tauri build --target universal-apple-darwin --bundles app,dmg

      - name: Stage artifact (macOS)
        if: runner.os == 'macOS'
        run: |
          version='${{ needs.verify.outputs.version }}'
          mkdir -p staging
          cp src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg \
            "staging/dshell-$version-macos-universal.dmg"

      - uses: actions/upload-artifact@v4
        with:
          name: dshell-${{ matrix.platform }}-${{ matrix.arch }}
          path: staging/*
          if-no-files-found: error
          retention-days: 7

  release:
    needs: [verify, build]
    if: github.event_name == 'push' || inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: |
          sha256sum -- *.exe *.dmg > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.verify.outputs.tag }}
          VERSION: ${{ needs.verify.outputs.version }}
          PRERELEASE: ${{ needs.verify.outputs.prerelease }}
        run: |
          arguments=(release create "$TAG" dist/*
            --title "dshell $VERSION"
            --generate-notes
            --verify-tag
            --draft)
          if [ "$PRERELEASE" = "true" ]; then
            arguments+=(--prerelease)
          fi
          gh "${arguments[@]}"
