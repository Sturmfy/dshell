[package]
name = "dshell"
version = "0.1.0"
description = "Tabbed desktop shell for DeepSeek Harness"
edition = "2021"
rust-version = "1.90"
license = "MIT"

[build-dependencies]
# Pinned exactly on purpose: the `unstable` multi-webview API changes shape
# between Tauri minors (see docs/ARCHITECTURE.md "pin policy").
tauri-build = { version = "=2.7.2", features = [] }

[dependencies]
# `unstable` enables multi-webview (`Window::add_child`) — the foundation of the
# whole tab model. It is a pure Cargo feature; tauri.conf.json needs nothing.
tauri = { version = "=2.12.3", features = ["unstable"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "rt", "rt-multi-thread", "macros", "time", "io-util", "sync", "net"] }
tokio-util = { version = "0.7", features = ["rt"] }

[target.'cfg(windows)'.dependencies]
# The content bridge talks to WebView2 directly so the DSH tabs never gain a
# Tauri capability (see `src/bridge`). These versions are pinned to the exact
# ones Tauri 2.12.3 / wry 0.57 already resolve; mixing WebView2 COM crates across
# versions produces incompatible interface types.
webview2-com = "=0.39.1"
windows-core = "=0.62.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
